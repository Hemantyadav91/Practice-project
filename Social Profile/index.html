<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    
    <!-- Font Awesome Cdnjs Link -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Social Profile</title>

    <!-- Style Element -->
     <style>
        /* -------------------- Default Styling -------------------- */


        :root {
            --bg-darkest: #0c0e12;     /* Deep slate background */
            --card-bg: #171b22;        /* Rich dark card container background */
            --accent-green: #2ecc71;   /* Neon mint accent color */
            --text-primary: #ffffff;   /* Pure white */
            --text-secondary: #8b949e; /* Muted gray for description */
            --button-bg: #21262d;      /* Flat background for social buttons */
            --button-hover: #30363d;   /* Dynamic button background on hover */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-darkest);
            color: var(--text-primary);
            min-height: 100vh;

            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-card {
            max-width: 380px;
            width: 100%;
            background-color: var(--card-bg);
            padding: 40px 32px;
            border-radius: 16px;
            border: 1px solid #21262d;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .avatar-container {
            width: 96px;
            height: 96px;
            margin: 0 auto 24px auto;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-green);
            padding: 4px;
            background-color: var(--card-bg);
        }

        .online-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 16px;
            height: 16px;
            background-color: var(--accent-green);
            border: 3px solid var(--card-bg);
            border-radius: 50%;
        }
        
        /* ------ Profile Text Details ------*/

        .name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .location {
            font-size: 0.9rem;
            color: var(--accent-green);
            font-weight: 600;
            margin-bottom: 20px;
        }

        .bio {
            font-size: 0.9rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        /* ------ Social links stack ------ */

        .links-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .social-links {
            text-decoration: none;
            padding: 14px 16px;
            background-color: var(--button-bg);
            color: var(--text-primary);
            border: 1px solid transparent;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 600;

            /* The Animation Transition rule */
            transition: background-color 0.2s ease-out, transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), border-color 0.2s ease-out;
        }
        
        /* Hover State (Desktop & Mouse Users) */
        .social-links:hover {
            background-color: var(--button-hover);
            border-color: var(--accent-green);
            transform: scale(1.03); 
        }

        /* Accessibility Focus State (Keyboard Users) */
        /* Only shows an outline when navigated using keyboard tab keys */
        
        .social-links:focus-visible {
            outline: 2px dashed var(--accent-green);
            outline-offset: 4px;
            background-color: var(--button-hover);
        }

        /* Active State  */
        .social-links:active {
            transform: scale(0.98);
        }

     </style>
</head>

<body>
    <div class="social-card">
        <!-- Avatar Wrapper -->
        <div class="avatar-container">
            <img class="avatar" src="https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?">
            <span class="online-badge" title="Active now"></span>
        </div>

        <!-- Bio Info -->
        <h1 class="name">Hemant Kumar Yadav</h1>
        <p class="location">London, United Kingdon</p>

        <p class="bio">"Senior Systems Engineer specializing in UI Architecture. Constantly crafting lightweight, semantic webistes."</p>

        <!-- Dynamic Socail Navigation Links -->
        <div class="links-group">
            <a href="#" class="social-links">
                <i class="fa-brands fa-github"></i> Github
            </a>

            <a href="#" class="social-links">
                <i class="fa-brands fa-linkedin"></i> LinkedIn
            </a>

            <a href="#" class="social-links">
                <i class="fa-brands fa-square-x-twitter"></i> Twitter
            </a>

            <a href="#" class="social-links">
                <i class="fa-brands fa-codepen"></i> CodePen
            </a>

            <a href="#" class="social-links">
                <i class="fa-regular fa-envelope"></i> EmailMe
            </a>
        </div>
    </div>
</body>

</html>
