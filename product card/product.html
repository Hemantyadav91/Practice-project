<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Google Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Cdnjs Link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Product Card</title>

    <!-- CSS Styling -->
     <style>
        /* ------------------- Default Styling ------------------- */

        :root {
            --hot-deal: #e53e3e; /* Bright Red */
            --dark-cyan: #3c8067;
            --very-dark-blue: #1c232b;
            --dark-grayish-blue: #6c7289;
            --white: #ffffff;
            --cream: #f2ebe3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 62.5%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--cream);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .product-card {
            max-width: 600px;
            background-color: var(--white);
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: none;
            display: flex;
        }

        .product-image {
            background-image: url('https://images.unsplash.com/photo-1587017539504-67cfbddac569?');
            flex: 1;
            min-height: 450px;
            background-size: cover;
            background-position: center;
        }

        .product-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3.2rem;
        }
        

        .category {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--dark-grayish-blue);
            margin-bottom: 1.5rem;
        }

        .product-title {
            font-size: 3.2rem;
            font-family: 'Fraunces', sans-serif;
            line-height: 1;
            color: var(--very-dark-blue);
            margin-bottom: 20px;
        }

        .product-description {
            font-size: 1.4rem;
            line-height: 1.6rem;
            margin-bottom: 25px;
            color: var(--dark-grayish-blue);
        }

        .price-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
            margin-bottom: 25px;
        }

        .current-price {
            font-size: 3.2rem;
            color: var(--hot-deal);
            font-family: 'Fraunces', sans-serif;
        }

        .old-price {
            font-size: 1.4rem;
            text-decoration: line-through;
            color: var(--dark-grayish-blue);
        }

        .discount-badge {
            background-color: var(--hot-deal);
            padding: 4px 8px;
            border-radius: 5px;
            color: var(--white);
            font-weight: 600;
            font-size: 1.2rem;
        }

        .buy-btn {
            cursor: pointer;
            font-weight: 700;
            background-color: var(--dark-cyan);
            border: none;
            border-radius: 0.8rem;
            padding: 1.5rem;
            color: var(--white);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            transition: transfrom 0.2s;
        }

        .buy-btn:hover {
            background-color: #1a4031;
            transition: translateY(-2px);
        }

        @media (max-width: 600px) {
            .product-card {
                flex-direction: column;
            }
            .product-image {
                min-height: 240px;
            }
        }

     </style>

</head>

<body>
    <article class="product-card">
        <div class="product-image"></div>

        <div class="product-content">
            <p class="category">Perfume</p>

            <h1 class="product-title">Gabrielle Essence Eau De Parfume</h1>

            <p class="product-description">
                A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.
            </p>

            <div class="price-container">
                <span class="current-price">$149.99</span>
                <span class="old-price">$169.99</span>
                <span class="discount-badge">15% OFF</span>
            </div>

            <button class="buy-btn">
                <i class="fa-solid fa-bolt"></i>
                Buy Now
            </button>
        </div>
    </article>
</body>

</html>
